<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CES Medical &middot; Cataract Pathways</title>
<style>
  :root {
    --navy: #001f54;
    --blue: #2c48ed;
    --ink-soft: #44557a;
    --rule: rgba(0, 31, 84, 0.12);
    --content-w: 2100px;
    --content-h: 2406px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #eeedf4;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
    background-image: radial-gradient(rgba(0, 31, 84, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #viewport.dragging { cursor: grabbing; }
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--content-w);
    height: var(--content-h);
    transform-origin: 0 0;
    will-change: transform;
    background: #fff;
    box-shadow: 0 24px 64px rgba(0, 31, 84, 0.22);
  }
  #content {
    width: var(--content-w);
    height: var(--content-h);
    border: 0;
    display: block;
    pointer-events: none;
    background: #fff;
  }
  #toolbar {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 2px;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0, 31, 84, 0.16);
  }
  #toolbar button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--navy);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 17px;
    font-family: inherit;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #toolbar button:hover { background: rgba(44, 72, 237, 0.1); color: var(--blue); }
  #toolbar button#zoom-fit {
    width: auto;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #zoom-label {
    min-width: 44px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    padding: 0 4px;
    user-select: none;
  }
  #hint {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 10;
    font-size: 12px;
    color: var(--ink-soft);
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 8px 24px rgba(0, 31, 84, 0.1);
    transition: opacity 0.3s ease;
  }
</style>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <iframe id="content" src="pathways-content.html" scrolling="no" title="CES Medical pathways diagram"></iframe>
    </div>
  </div>

  <div id="toolbar">
    <button id="zoom-out" aria-label="Zoom out">&minus;</button>
    <button id="zoom-fit" aria-label="Fit to screen">Fit</button>
    <button id="zoom-in" aria-label="Zoom in">&plus;</button>
    <span id="zoom-label">100%</span>
  </div>

  <div id="hint">Scroll or drag to pan &middot; Pinch or Ctrl/Cmd+scroll to zoom</div>

  <script>
    (function () {
      var CONTENT_W = 2100, CONTENT_H = 2406;
      var MIN_ZOOM = 0.1, MAX_ZOOM = 5;

      var viewport = document.getElementById('viewport');
      var stage = document.getElementById('stage');
      var label = document.getElementById('zoom-label');
      var hint = document.getElementById('hint');

      var zoom = 1, panX = 0, panY = 0;

      function apply() {
        stage.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
        label.textContent = Math.round(zoom * 100) + '%';
      }

      function fit() {
        var vw = viewport.clientWidth, vh = viewport.clientHeight;
        var scale = Math.min(vw / CONTENT_W, vh / CONTENT_H) * 0.92;
        zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, scale));
        panX = (vw - CONTENT_W * zoom) / 2;
        panY = (vh - CONTENT_H * zoom) / 2;
        apply();
      }

      function zoomAt(clientX, clientY, newZoom) {
        var rect = viewport.getBoundingClientRect();
        var mx = clientX - rect.left, my = clientY - rect.top;
        var cx = (mx - panX) / zoom, cy = (my - panY) / zoom;
        newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
        panX = mx - cx * newZoom;
        panY = my - cy * newZoom;
        zoom = newZoom;
        apply();
      }

      function zoomStep(factor) {
        var rect = viewport.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, zoom * factor);
      }

      // Wheel: plain = pan, ctrl/cmd (incl. trackpad pinch) = zoom
      viewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (hint.style.opacity !== '0') { hint.style.opacity = '0'; }
        if (e.ctrlKey || e.metaKey) {
          var factor = Math.exp(-e.deltaY * 0.01);
          zoomAt(e.clientX, e.clientY, zoom * factor);
        } else {
          panX -= e.deltaX;
          panY -= e.deltaY;
          apply();
        }
      }, { passive: false });

      // Drag to pan (mouse + touch, single pointer)
      var dragging = false, lastX = 0, lastY = 0;
      var activePointers = new Map();
      var pinchStartDist = 0, pinchStartZoom = 1;

      function pointerDist(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
      }
      function pointerMid(p1, p2) {
        return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      }

      viewport.addEventListener('pointerdown', function (e) {
        viewport.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        hint.style.opacity = '0';
        if (activePointers.size === 1) {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          viewport.classList.add('dragging');
        } else if (activePointers.size === 2) {
          dragging = false;
          var pts = Array.from(activePointers.values());
          pinchStartDist = pointerDist(pts[0], pts[1]);
          pinchStartZoom = zoom;
        }
      });

      viewport.addEventListener('pointermove', function (e) {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 2) {
          var pts = Array.from(activePointers.values());
          var dist = pointerDist(pts[0], pts[1]);
          var mid = pointerMid(pts[0], pts[1]);
          if (pinchStartDist > 0) {
            var newZoom = pinchStartZoom * (dist / pinchStartDist);
            zoomAt(mid.x, mid.y, newZoom);
          }
        } else if (dragging) {
          panX += e.clientX - lastX;
          panY += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          apply();
        }
      });

      function endPointer(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) { pinchStartDist = 0; }
        if (activePointers.size === 0) {
          dragging = false;
          viewport.classList.remove('dragging');
        }
      }
      viewport.addEventListener('pointerup', endPointer);
      viewport.addEventListener('pointercancel', endPointer);

      document.getElementById('zoom-in').addEventListener('click', function () { zoomStep(1.25); });
      document.getElementById('zoom-out').addEventListener('click', function () { zoomStep(0.8); });
      document.getElementById('zoom-fit').addEventListener('click', fit);

      window.addEventListener('keydown', function (e) {
        if (e.key === '+' || e.key === '=') { zoomStep(1.25); }
        else if (e.key === '-' || e.key === '_') { zoomStep(0.8); }
        else if (e.key === '0') { fit(); }
      });

      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });

      fit();
    })();
  </script>
</body>
</html>
